<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Stream - Login</title>

  <!-- favicon-->
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

  <!--css-->
  <link rel="stylesheet" href="./assets/css/style.css">
  
  <!-- google font link-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    hr {
      border: none;
      height: 1px;
      background-color: #c5c7c9;
      margin: 20px 0;
    }

    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    }

    .form-title {
      color: var(--oxford-blue-1);
      font-family: var(--ff-poppins);
      font-size: 3.4rem;
      font-weight: var(--fw-800);
      text-align: center;
      margin-bottom: 20px;
    }

    .form-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .form-field {
      flex: 0 0 48%;
      margin-bottom: 20px;
    }

    .form-field label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-field input,
    .form-field select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .alert-msg {
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-error { background: #f8d7da; color: #721c24; }
  </style>

</head>

<body>
<header class="header">
    <div class="header-top">
      <div class="container">
        <ul class="contact-list">
          <li class="contact-item">
            <ion-icon name="mail-outline"></ion-icon>
            <a href="mailto:redstream001@gmail.com" class="contact-link">redstream001@gmail.com</a>
          </li>
          <li class="contact-item">
            <ion-icon name="call-outline"></ion-icon>
            <a href="tel:+917558951351" class="contact-link">+91-7558-951-351</a>
          </li>
        </ul>
        <ul class="social-list">
          <li>
            <a href="#" class="social-link"><ion-icon name="logo-facebook"></ion-icon></a>
          </li>
          <li>
            <a href="#" class="social-link"><ion-icon name="logo-instagram"></ion-icon></a>
          </li>
          <li>
            <a href="#" class="social-link"><ion-icon name="logo-twitter"></ion-icon></a>
          </li>
        </ul>
      </div>
    </div>
    <div class="header-bottom" data-header>
      <div class="container">
        <a href="index.html" class="logo">Red Stream</a>
        <nav class="navbar container" data-navbar>
          <ul class="navbar-list">
            <li><a href="index.html" class="navbar-link" data-nav-link>Home</a></li>
            <li><a href="index.html#service" class="navbar-link" data-nav-link>Find donor</a></li>
            <li><a href="about.html" class="navbar-link" data-nav-link>About Us</a></li>
            <li><a href="contact.html" class="navbar-link" data-nav-link>Contact</a></li>
          </ul>
        </nav>
        <a href="register.html" class="btn">Login / Register</a>
      </div>
    </div>
  </header>

  <main>
    <article>
      <section class="section hero" id="home" style="background-image: url('./assets/images/hero-bg.png'); margin: 0%;" aria-label="hero">
        <div class="container">
          <div class="form-container">
            <div class="form-title">Login</div>
            <hr><br>
            <div id="alert" class="alert-msg"></div>
            <form id="loginForm">
              <div class="form-section">
                <div class="form-field">
                  <label for="email">Email:</label>
                  <input type="email" id="email" name="email" required>
                </div>
                <div class="form-field">
                  <label for="password">Password:</label>
                  <input type="password" id="password" name="password" required>
                </div>
              </div><br>
              <button type="submit" class="btn">Login</button>
            </form><br><br>
            <div class="form-title" style="font-size: 1.6rem;">Not Registered? <u><a href="register.html" style="display: inline; color: #216aca;">Register Here</a></u></div>
          </div>
          <figure class="hero-banner">
            <img src="./assets/images/bg.svg" width="587" height="839" alt="hero banner" class="w-100">
            <center><h1>Welcome back</h1></center>
          </figure>
        </div>
      </section>
    </article>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertDiv = document.getElementById('alert');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          alertDiv.className = 'alert-msg alert-success';
          alertDiv.style.display = 'block';
          alertDiv.textContent = 'Login Successful! Welcome ' + data.user.name;
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          alertDiv.className = 'alert-msg alert-error';
          alertDiv.style.display = 'block';
          alertDiv.textContent = data.message || 'Login failed';
        }
      } catch (err) {
        alertDiv.className = 'alert-msg alert-error';
        alertDiv.style.display = 'block';
        alertDiv.textContent = 'Server connection error';
      }
    });
  </script>

  <script src="./assets/js/script.js" defer></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
